name: Rebuild ASCII portrait

# Manual only. Needs input/photo.jpg in the checkout, which it is not by default (input/ is gitignored),
# so normally you run the build locally:
#   python scripts/ascii/build_svg.py
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y gifsicle
      - run: pip install pillow numpy opencv-python-headless playwright fonttools && python -m playwright install --with-deps chromium
      - run: python scripts/ascii/build_svg.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ascii/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: rebuild ASCII portrait [skip ci]"
          git pull --rebase
          git push
