name: 3D contribution chart

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install fonttools

      # Built from live GitHub data by scripts/city.py (no third-party chart service)
      - name: Render the contribution city
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/city.py

      - name: Bust the README image cache
        run: python scripts/bust.py 3d
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/3d/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: refresh 3D contribution chart [skip ci]"
          # other workflows may push at the same time: rebase and retry instead of failing
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "push failed (attempt $attempt), retrying"; sleep $((attempt * 3))
          done
          exit 1
