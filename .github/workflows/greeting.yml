name: Live greeting

on:
  schedule:
    # exactly on the IST slot boundaries 05:00, 12:00, 17:00, 22:00 (= 23:30, 06:30, 11:30, 16:30 UTC),
    - cron: "30 23,6,11,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - run: python scripts/greeting.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: refresh greeting [skip ci]"
          # other workflows may push at the same time: rebase and retry instead of failing
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "push failed (attempt $attempt), retrying"; sleep $((attempt * 3))
          done
          exit 1
