name: Tic-tac-toe

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      render_only:
        description: Re-render the README board from data/game.json
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: readme-writer
  cancel-in-progress: false

jobs:
  play:
    # Title is only ever compared here; the script receives it through env (never interpolated into a shell).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.type != 'Bot' && startsWith(github.event.issue.title, 'ttt|'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Play
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_USER_TYPE: ${{ github.event.issue.user.type }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/game.py --assets
            python scripts/game.py --render
          else
            python scripts/game.py
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game.json assets/game README.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "game: update board [skip ci]"
          git pull --rebase
          git push
